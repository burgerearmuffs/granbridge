<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GRANBRIDGE Lower Third</title>
  <style>
    html, body { margin: 0; background: transparent; font-family: system-ui, sans-serif; color: #fff; }
    #lower-third {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 100%);
      padding: 32px 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #mode-line {
      font-size: 14px;
      opacity: .75;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    #players-line {
      font-size: 28px;
      font-weight: 700;
    }
    #status { position: fixed; top: 8px; right: 12px; font-size: 13px; opacity: .6; }
  </style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="lower-third">
    <div id="mode-line">Now playing</div>
    <div id="players-line"></div>
  </div>
  <script src="common.js"></script>
  <script>
    const modeEl = document.getElementById("mode-line");
    const playersEl = document.getElementById("players-line");
    const statusEl = document.getElementById("status");

    function renderState(state) {
      const mode = (state.mode_view && state.mode_view.mode) || state.mode || "Darts";
      modeEl.textContent = "Now playing: " + mode;
      const names = (state.players || []).map(function(p) { return p.name; });
      playersEl.textContent = names.join("  vs  ");
    }

    connectGranbridge(function onEvent(ev) {
      if (ev.type === "_open") { statusEl.textContent = "connected"; }
      // Handle both game_started and game_state events (both contain game info)
      if (ev.type === "game_started") { renderState(ev.state || ev); }
      if (ev.type === "game_state") { renderState(ev.state); }
    });
  </script>
</body>
</html>
