# GRANBRIDGE multiplayer stack for TOWER.
# One command:  docker compose up -d --build
# Only DOMAIN is required (set it in .env). TURN_SECRET auto-generates if unset.

services:

  # One-shot: generate the shared TURN secret once (root → deterministic perms).
  init:
    image: alpine:3.20
    command: >
      sh -c '[ -n "$$TURN_SECRET" ] && exit 0;
             [ -s /secrets/turn_secret ] && exit 0;
             head -c 32 /dev/urandom | base64 | tr -d "\n" > /secrets/turn_secret;
             chmod 644 /secrets/turn_secret;
             echo "generated /secrets/turn_secret"'
    environment:
      TURN_SECRET: "${TURN_SECRET:-}"
    volumes:
      - secrets:/secrets

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$ACME_EMAIL" ]; then
          awk -v e="$$ACME_EMAIL" '{print} (ins==0 && $$0=="{"){print "\temail " e; ins=1}' /etc/caddy/Caddyfile > /tmp/Caddyfile
          exec caddy run --config /tmp/Caddyfile --adapter caddyfile
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]

  broker:
    build: .
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      BROKER_HOST: "0.0.0.0"
      BROKER_PORT: "8788"
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
      TURN_SECRET: "${TURN_SECRET:-}"
      TURN_TTL: "${TURN_TTL:-86400}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      SECRET_PATH: "/secrets/turn_secret"
      TURN_RATE_PER_MIN: "${TURN_RATE_PER_MIN:-30}"
      CONN_RATE_PER_MIN: "${CONN_RATE_PER_MIN:-60}"
      MSG_RATE_PER_SEC: "${MSG_RATE_PER_SEC:-20}"
      STATS_DB_PATH: "/data/stats.db"
      STATS_RATE_PER_MIN: "${STATS_RATE_PER_MIN:-30}"
    volumes:
      - secrets:/secrets:ro
      - data:/data
    networks: [backend]
    # No host port: only Caddy reaches the broker (smaller public surface).

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
      TURN_REALM: "${TURN_REALM:-${DOMAIN}}"
      TURN_SECRET: "${TURN_SECRET:-}"
      TURN_EXTERNAL_IP: "${TURN_EXTERNAL_IP:-}"
      TURN_TOTAL_QUOTA: "${TURN_TOTAL_QUOTA:-200}"
      TURN_MAX_BPS: "${TURN_MAX_BPS:-0}"
    volumes:
      - caddy_data:/caddy-data:ro      # read Caddy's Let's Encrypt cert
      - secrets:/secrets:ro
      - ./coturn/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks: [backend]

networks:
  backend:

volumes:
  caddy_data:
  caddy_config:
  secrets:
  data:
